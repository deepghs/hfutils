#file: noinspection YAMLSchemaValidation
name: Code Test

on:
  - push
  - workflow_dispatch

jobs:
  unittest:
    name: Code test (${{ matrix.os }}, py${{ matrix.python-version }}, hub${{ matrix.hub }})
    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'test skip') }}
    # Replay only: every request is answered from test/cassettes, nothing talks to huggingface.co,
    # so there is no token and no rate limit to share between the cells.
    # `hub` is the exact huggingface_hub requirement under test (the floor of each client generation first).
    # `git` cells also run the tests that need git, git-lfs and the native hf_xet client: they are recorded and replayed through
    # mitmproxy, which is installed on its own because it needs a newer Python than some cells (Linux only, see test/cassettes/README.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: 'ubuntu-latest', python-version: '3.8', hub: '==0.20.3', git: true }
          - { os: 'ubuntu-latest', python-version: '3.8', hub: '==0.31.0' }
          - { os: 'ubuntu-latest', python-version: '3.9', hub: '<1' }
          - { os: 'ubuntu-latest', python-version: '3.9', hub: '>=1,<2', git: true }
          - { os: 'ubuntu-latest', python-version: '3.10', hub: '>=2' }
          - { os: 'ubuntu-latest', python-version: '3.11', hub: '>=2', lean: true }
          - { os: 'ubuntu-latest', python-version: '3.12', hub: '>=2', git: true }
          - { os: 'ubuntu-latest', python-version: '3.13', hub: '>=2' }
          - { os: 'ubuntu-latest', python-version: '3.14', hub: '>=2' }
          - { os: 'windows-latest', python-version: '3.8', hub: '==0.20.3' }
          - { os: 'windows-latest', python-version: '3.12', hub: '>=2' }
          - { os: 'macos-latest', python-version: '3.9', hub: '>=1,<2' }
          - { os: 'macos-latest', python-version: '3.12', hub: '>=2', lean: true }

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Get system version for Windows
        if: ${{ contains(matrix.os, 'windows') }}
        shell: bash
        run: |
          echo "OS_NAME=Windows" >> $GITHUB_ENV
          echo "IS_WIN=1" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Get system version for MacOS
        if: ${{ contains(matrix.os, 'macos') }}
        shell: bash
        run: |
          echo "OS_NAME=MacOS" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=1" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Set environment for PyPy
        if: ${{ contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=1" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependences on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree cloc wget curl make zip
          sudo apt-get install -y git-lfs
          sudo apt-get install p7zip-full rar unrar
      - name: Set up system dependences on Windows
        if: ${{ env.OS_NAME == 'Windows' }}
        shell: bash
        run: |
          choco install tree cloc wget curl make zip
          choco install 7zip winrar  # unrar should be added
      - name: Set up system dependences on MacOS
        if: ${{ env.OS_NAME == 'MacOS' }}
        run: |
          brew install tree cloc wget curl make zip
          brew install sevenzip
          brew install --cask rar || echo "the rar cask is disabled in Homebrew (2026-09-01): the rar tests that need a tool are skipped"
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flake8 setuptools wheel twine
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -r requirements-transfer.txt
          pip install -r requirements-7z.txt
          pip install -r requirements-rar.txt
          # the optional packages of the zip reader (AES, deflate64, zstd); the `lean` cells go without them, so that the
          # "this member needs a package" paths run too
          if [ -z "${{ matrix.lean }}" ]; then pip install -r requirements-zip.txt; fi
          # the exact client generation of this cell, whatever the requirement files resolved
          pip install "huggingface_hub${{ matrix.hub }}"
      - name: Install mitmproxy for the git and Xet tests
        if: ${{ matrix.git }}
        shell: bash
        run: |
          pip install uv
          uv tool install mitmproxy --python 3.12
          echo "HFUTILS_MITMDUMP=$(uv tool dir --bin)/mitmdump" >> $GITHUB_ENV
          git lfs version
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          pip list
          tree .
          cloc hfutils
          cloc test
      - name: Run unittest
        env:
          CI: 'true'
          HFUTILS_VCR_MODE: none
        shell: bash
        run: |
          make unittest IS_WIN=${{ env.IS_WIN }} IS_MAC=${{ env.IS_MAC }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}-hub${{ matrix.hub }}
          fail_ci_if_error: false

  build_cli:
    name: CLI Build
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-22.04'
          - 'windows-2022'
          - 'macos-14'
        python-version:
          - '3.8'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Get system version for Windows
        if: ${{ contains(matrix.os, 'windows') }}
        shell: bash
        run: |
          echo "OS_NAME=Windows" >> $GITHUB_ENV
          echo "IS_WIN=1" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Get system version for MacOS
        if: ${{ contains(matrix.os, 'macos') }}
        shell: bash
        run: |
          echo "OS_NAME=MacOS" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=1" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Set environment for PyPy
        if: ${{ contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=1" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v3.3.0
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree cloc wget curl make zip
      - name: Set up system dependencies on Windows
        if: ${{ env.OS_NAME == 'Windows' }}
        shell: bash
        run: |
          choco install tree cloc wget curl make zip
      - name: Set up system dependencies on MacOS
        if: ${{ env.OS_NAME == 'MacOS' }}
        run: |
          brew install tree cloc wget curl make zip
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install -r requirements-transfer.txt
          pip install -r requirements-7z.txt
          pip install -r requirements-rar.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          pip list
          tree .
      - name: Get package version
        shell: bash
        run: |
          python -c 'from hfutils.config.meta import __VERSION__;print(__VERSION__)'
          echo "PACKAGE_VERSION=$(python -c 'from hfutils.config.meta import __VERSION__;print(__VERSION__)')" >> $GITHUB_ENV
          echo "GIT_COMMIT_ID=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
          echo "PYTHON_VERSION=$(python -V | xargs -n 1 | tail -1)" >> $GITHUB_ENV
          echo "CPU_ARCH=$(uname -m)" >> $GITHUB_ENV
      - name: Get CLI name
        shell: bash
        run: |
          echo "ZIP_NAME=hfutils-v${{ env.PACKAGE_VERSION }}-${{ env.OS_NAME }}-${{ env.CPU_ARCH }}-${{ env.GIT_COMMIT_ID }}-standalone" >> $GITHUB_ENV
          echo "CLI_NAME=hfutils-v${{ env.PACKAGE_VERSION }}-${{ env.OS_NAME }}-${{ env.CPU_ARCH }}" >> $GITHUB_ENV
      - name: Build standalone cli on Linux and MacOS
        if: ${{ env.OS_NAME != 'Windows' }}
        shell: bash
        run: |
          make build
          mkdir -p dist/${{ env.CLI_NAME }}
          cp dist/hfutils dist/${{ env.CLI_NAME }}/hfutils
          cd dist
          zip -r ${{ env.ZIP_NAME }}.zip ${{ env.CLI_NAME }}
          cd ..
          ls -al dist
          dist/hfutils -v
          dist/hfutils -h
      - name: Build standalone CLI on Windows
        if: ${{ env.OS_NAME == 'Windows' }}
        shell: bash
        run: |
          make build
          mkdir -p dist/${{ env.CLI_NAME }}
          cp dist/hfutils.exe dist/${{ env.CLI_NAME }}/hfutils.exe
          cd dist
          zip -r ${{ env.ZIP_NAME }}.zip ${{ env.CLI_NAME }}
          cd ..
          ls -al dist
          dist/hfutils -v
          dist/hfutils -h
      - name: Check Whoami
        continue-on-error: true  # live smoke test, see hf_live.yml for the real thing
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          dist/hfutils whoami
          dist/hfutils whoami | grep narugo1992
      - name: Check Downloading
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # a public repository: the private deepghs/konachan_index answers 403 "Private repository storage limit reached"
          dist/hfutils download -r deepghs/public_unittest_repo -d . -o public_repo
          ls -al public_repo
          ls -al public_repo | grep animes.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: hfutils-v${{ env.PACKAGE_VERSION }}-${{ env.OS_NAME }}-${{ env.CPU_ARCH }}-${{ env.GIT_COMMIT_ID }}
          path: dist
